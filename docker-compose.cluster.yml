services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    # Build the checked-out cluster node by default; set
    # CLI_PROXY_PULL_POLICY=always only for an explicitly pinned image.
    pull_policy: ${CLI_PROXY_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: ${CLI_PROXY_CONTAINER_NAME:-cli-proxy-api-cluster}
    environment:
      HOME_JWT: ${HOME_JWT:-}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${ANTIGRAVITY_OAUTH_CLIENT_ID:-}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      CPA_LICENSE_PROVIDER: ${CPA_LICENSE_PROVIDER:-}
      CPA_LICENSE_PRODUCT_CODE: ${CPA_LICENSE_PRODUCT_CODE:-}
      CPA_LICENSE_API_BASE_URL: ${CPA_LICENSE_API_BASE_URL:-}
      CPA_LICENSE_PUBLIC_KEY: ${CPA_LICENSE_PUBLIC_KEY:-}
      CPA_LICENSE_PLUGIN_PUBLIC_KEY: ${CPA_LICENSE_PLUGIN_PUBLIC_KEY:-}
      CPA_LICENSE_CLIENT_ID: ${CPA_LICENSE_CLIENT_ID:-}
      CPA_LICENSE_CLIENT_SECRET: ${CPA_LICENSE_CLIENT_SECRET:-}
      CPA_LICENSE_CLIENT_SECRET_FILE: /run/secrets/cpa-license-client-secret
      CPA_LICENSE_STATE_DIR: ${CPA_LICENSE_STATE_DIR:-}
      CPA_LICENSE_SHOP_AUTH_URL: ${CPA_LICENSE_SHOP_AUTH_URL:-}
      CPA_LICENSE_SHOP_EXCHANGE_PATH: ${CPA_LICENSE_SHOP_EXCHANGE_PATH:-}
      CPA_LICENSE_ACTIVATE_PATH: ${CPA_LICENSE_ACTIVATE_PATH:-}
      CPA_LICENSE_REFRESH_PATH: ${CPA_LICENSE_REFRESH_PATH:-}
      CPA_LICENSE_VERIFY_PATH: ${CPA_LICENSE_VERIFY_PATH:-}
      CPA_LICENSE_GRACE_PATH: ${CPA_LICENSE_GRACE_PATH:-}
      CPA_LICENSE_REFRESH_INTERVAL: ${CPA_LICENSE_REFRESH_INTERVAL:-}
      CPA_LICENSE_GRACE_PERIOD: ${CPA_LICENSE_GRACE_PERIOD:-}
      CPA_LICENSE_STORAGE_KEY: ${CPA_LICENSE_STORAGE_KEY:-}
      CPA_LICENSE_EXECUTABLE_SHA256: ${CPA_LICENSE_EXECUTABLE_SHA256:-}
      CPA_LICENSE_CLAIM_PATH: ${CPA_LICENSE_CLAIM_PATH:-}
    ports:
      # The cluster node still listens on 8317 in the container; use a
      # customer-selected host port when running beside another node.
      - "${CLI_PROXY_HOST_PORT:-8317}:8317"
    volumes:
      - ${CLI_PROXY_HOME_PATH:-./home}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
      # Keep relative license paths as host bind mounts rather than named
      # volumes so the installer and checker share one persistent state path.
      - type: bind
        source: ${CLI_PROXY_LICENSE_PATH:-./data/license}
        target: /CLIProxyAPI/data/license
    secrets:
      - source: cpa_license_client_secret
        target: cpa-license-client-secret
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./CLIProxyAPI -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped

secrets:
  cpa_license_client_secret:
    file: ${CPA_LICENSE_CLIENT_SECRET_HOST_PATH:-./secrets/cpa-license-client-secret}
