services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/abc124774961/cli-proxy-api-cpa:v7.2.148-cpa.3}
    # A customer checkout must run the code in this directory by default.
    # Set CLI_PROXY_PULL_POLICY=always when intentionally using a published
    # image instead of building the checked-out source.
    pull_policy: ${CLI_PROXY_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: ${CLI_PROXY_CONTAINER_NAME:-cli-proxy-api}
    environment:
      DEPLOY: ${DEPLOY:-}
      # Management and storefront license settings are passed explicitly so a
      # host-side .env file is available inside the container as well.
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
      # Optional Antigravity Google OAuth app credentials. They are read at
      # login/refresh time and are unrelated to the CPA storefront credentials.
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${ANTIGRAVITY_OAUTH_CLIENT_ID:-}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      CPA_LICENSE_PROVIDER: ${CPA_LICENSE_PROVIDER:-}
      CPA_LICENSE_PRODUCT_CODE: ${CPA_LICENSE_PRODUCT_CODE:-}
      CPA_LICENSE_API_BASE_URL: ${CPA_LICENSE_API_BASE_URL:-}
      CPA_LICENSE_PUBLIC_KEY: ${CPA_LICENSE_PUBLIC_KEY:-}
      CPA_LICENSE_PLUGIN_PUBLIC_KEY: ${CPA_LICENSE_PLUGIN_PUBLIC_KEY:-}
      CPA_LICENSE_CLIENT_ID: ${CPA_LICENSE_CLIENT_ID:-}
      CPA_LICENSE_CLIENT_SECRET: ${CPA_LICENSE_CLIENT_SECRET:-}
      # The mounted file is optional at the storefront level. An empty file
      # does not erase CPA_LICENSE_CLIENT_SECRET; a non-empty file takes
      # precedence and keeps the secret out of the Compose environment.
      CPA_LICENSE_CLIENT_SECRET_FILE: /run/secrets/cpa-license-client-secret
      CPA_LICENSE_STATE_DIR: ${CPA_LICENSE_STATE_DIR:-}
      CPA_LICENSE_SHOP_AUTH_URL: ${CPA_LICENSE_SHOP_AUTH_URL:-}
      CPA_LICENSE_SHOP_EXCHANGE_PATH: ${CPA_LICENSE_SHOP_EXCHANGE_PATH:-}
      CPA_LICENSE_ACTIVATE_PATH: ${CPA_LICENSE_ACTIVATE_PATH:-}
      CPA_LICENSE_REFRESH_PATH: ${CPA_LICENSE_REFRESH_PATH:-}
      CPA_LICENSE_VERIFY_PATH: ${CPA_LICENSE_VERIFY_PATH:-}
      CPA_LICENSE_GRACE_PATH: ${CPA_LICENSE_GRACE_PATH:-}
      CPA_LICENSE_REFRESH_INTERVAL: ${CPA_LICENSE_REFRESH_INTERVAL:-}
      CPA_LICENSE_GRACE_PERIOD: ${CPA_LICENSE_GRACE_PERIOD:-}
      CPA_LICENSE_STORAGE_KEY: ${CPA_LICENSE_STORAGE_KEY:-}
      CPA_LICENSE_EXECUTABLE_SHA256: ${CPA_LICENSE_EXECUTABLE_SHA256:-}
      CPA_LICENSE_CLAIM_PATH: ${CPA_LICENSE_CLAIM_PATH:-}
    ports:
      # The CPA process listens on 8317 inside the container. Customers can
      # choose another host port (for example 18320) for parallel validation.
      - "${CLI_PROXY_HOST_PORT:-8317}:8317"
      # OAuth/legacy callback listeners keep their container ports; each host
      # side can be changed when another CPA instance already owns the default.
      - "${CLI_PROXY_HOST_PORT_8085:-8085}:8085"
      - "${CLI_PROXY_HOST_PORT_1455:-1455}:1455"
      - "${CLI_PROXY_HOST_PORT_54545:-54545}:54545"
      - "${CLI_PROXY_HOST_PORT_51121:-51121}:51121"
      - "${CLI_PROXY_HOST_PORT_11451:-11451}:11451"
    volumes:
      # Long syntax keeps values such as `config.yaml` as host bind paths.
      # Short syntax interprets a bare relative value as a named volume on
      # some Compose versions, which can hide the customer's configuration.
      - type: bind
        source: ${CLI_PROXY_CONFIG_PATH:-./config.yaml}
        target: /CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
      # Keep installation identity, signed leases and encrypted plugin packages
      # across container recreation or image upgrades.
      # Long syntax forces every relative value to be a host bind path rooted
      # at this Compose file, including values such as `data/license` that
      # Docker Compose short syntax would otherwise treat as named volumes.
      - type: bind
        source: ${CLI_PROXY_LICENSE_PATH:-./data/license}
        target: /CLIProxyAPI/data/license
    secrets:
      - source: cpa_license_client_secret
        target: cpa-license-client-secret
    restart: unless-stopped

secrets:
  cpa_license_client_secret:
    file: ${CPA_LICENSE_CLIENT_SECRET_HOST_PATH:-./secrets/cpa-license-client-secret}
