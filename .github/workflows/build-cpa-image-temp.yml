name: Temporary CPA image build

on:
  push:
    branches:
      - codex/build-cpa-image

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/abc124774961/cli-proxy-api-cpa:v7.2.148-cpa.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CPA image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --build-arg VERSION=v7.2.148-cpa.4 \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")" \
            --tag "$IMAGE" \
            --push \
            .
