name: CPA release

on:
  push:
    tags:
      - 'v*-cpa.*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.26.3'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cli-proxy-api-cpa

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run Go tests
        run: go test ./...
      - name: Build server
        run: go build -buildvcs=false ./cmd/server
      - name: Validate customer install scripts
        run: |
          bash -n install-cpa-release.sh scripts/check-license-deployment.sh scripts/check-license-runtime.sh scripts/verify-release-bundle.sh
          test -x install-cpa-release.sh
          test -x scripts/check-license-deployment.sh
          test -x scripts/check-license-runtime.sh
          test -x scripts/verify-release-bundle.sh
          test -x scripts/check-license-deployment_test.sh
          bash scripts/check-license-deployment_test.sh
          test -x scripts/check-license-runtime_test.sh
          bash scripts/check-license-runtime_test.sh
      - name: Validate release tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-cpa\.[0-9]+$ ]]
      - name: Verify public release bundle
        run: scripts/verify-release-bundle.sh "$GITHUB_REF_NAME"

  package:
    name: Package source bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create source archive and checksums
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          mkdir -p dist
          archive="dist/CLIProxyAPI-CPA-${version}.tar.gz"
          git archive --format=tar.gz --prefix="CLIProxyAPI-CPA-${version}/" "$version" > "$archive"
          cp release-manifest.json "dist/CLIProxyAPI-CPA-${version}.manifest.json"
          (cd dist && sha256sum CLIProxyAPI-CPA-* > checksums.txt)
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: cpa-release-assets
          path: dist/

  publish:
    name: Publish GitHub release and GHCR image
    needs:
      - verify
      - package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cpa-release-assets
          path: dist
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Read reproducible build timestamp
        id: release-meta
        run: echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build and publish pinned multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.release-meta.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
